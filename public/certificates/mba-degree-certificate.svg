<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" style="background:#FAF7EE;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&amp;family=Cinzel+Decorative:wght@700;900&amp;family=MedievalSharp&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&amp;family=Great+Vibes&amp;display=swap');

      .inst-title {
        font-family: 'Cinzel Decorative', 'MedievalSharp', 'Old English Text MT', Georgia, serif;
        font-weight: 700;
        fill: #1A2847;
        letter-spacing: 1px;
      }
      .inst-location {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-size: 20px;
        fill: #334155;
        letter-spacing: 2px;
      }
      .cert-intro {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 22px;
        font-weight: 600;
        fill: #1E293B;
        letter-spacing: 1.5px;
      }
      .student-name {
        font-family: 'Cinzel Decorative', 'MedievalSharp', serif;
        font-weight: 900;
        font-size: 38px;
        fill: #0F172A;
        letter-spacing: 2px;
      }
      .body-text {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 16.5px;
        fill: #1E293B;
        line-height: 1.7;
      }
      .degree-title {
        font-family: 'Cinzel Decorative', 'MedievalSharp', serif;
        font-weight: 900;
        font-size: 34px;
        fill: #0F2747;
        letter-spacing: 1.5px;
      }
      .degree-major {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-weight: 700;
        font-size: 25px;
        fill: #0F766E;
      }
      .testimony-text {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 16px;
        fill: #334155;
      }
      .sig-title {
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 700;
        font-size: 16px;
        fill: #1E293B;
        letter-spacing: 2px;
      }
      .sig-cursive {
        font-family: 'Great Vibes', cursive;
        font-size: 34px;
        fill: #1E293B;
      }
      .reg-text {
        font-family: 'Cinzel', monospace, serif;
        font-size: 13px;
        font-weight: 600;
        fill: #475569;
        letter-spacing: 0.5px;
      }
    </style>

    <!-- Parchment subtle texture gradient -->
    <radialGradient id="parchmentBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FCFAF2" />
      <stop offset="60%" stop-color="#F7F2E2" />
      <stop offset="100%" stop-color="#ECE2C6" />
    </radialGradient>

    <!-- Metallic Gold Foil Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="25%" stop-color="#FFF2A1" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="75%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <radialGradient id="sealCenter" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#EAB308" />
      <stop offset="85%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#713F12" />
    </radialGradient>

    <!-- Filter for subtle vintage paper drop shadow -->
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="1200" height="850" fill="url(#parchmentBg)" />

  <!-- Outer Fine Border -->
  <rect x="25" y="25" width="1150" height="800" fill="none" stroke="#2B3A55" stroke-width="2" />
  <rect x="35" y="35" width="1130" height="780" fill="none" stroke="#D4AF37" stroke-width="1.5" />
  
  <!-- Intricate Vintage Inner Frame -->
  <rect x="42" y="42" width="1116" height="766" fill="none" stroke="#2B3A55" stroke-width="3" stroke-dasharray="16, 4, 4, 4" />
  <rect x="52" y="52" width="1096" height="746" fill="none" stroke="#64748B" stroke-width="0.8" />

  <!-- Corner Flourish Accents -->
  <g fill="none" stroke="#2B3A55" stroke-width="1.5">
    <!-- Top-Left -->
    <path d="M42,90 Q75,75 90,42 M55,55 L85,85 M55,85 L85,55" />
    <circle cx="65" cy="65" r="8" fill="#D4AF37" opacity="0.8" />
    <!-- Top-Right -->
    <path d="M1158,90 Q1125,75 1110,42 M1145,55 L1115,85 M1145,85 L1115,55" />
    <circle cx="1135" cy="65" r="8" fill="#D4AF37" opacity="0.8" />
    <!-- Bottom-Left -->
    <path d="M42,760 Q75,775 90,808 M55,795 L85,765 M55,765 L85,795" />
    <circle cx="65" cy="785" r="8" fill="#D4AF37" opacity="0.8" />
    <!-- Bottom-Right -->
    <path d="M1158,760 Q1125,775 1110,808 M1145,795 L1115,765 M1145,765 L1115,795" />
    <circle cx="1135" cy="785" r="8" fill="#D4AF37" opacity="0.8" />
  </g>

  <!-- Faint Watermark Emblem in Background -->
  <g opacity="0.06" transform="translate(600, 420)">
    <circle r="210" fill="none" stroke="#1A2847" stroke-width="6" />
    <circle r="195" fill="none" stroke="#1A2847" stroke-width="2" />
    <text text-anchor="middle" y="-40" font-family="'Cinzel Decorative', serif" font-size="28" font-weight="700" fill="#1A2847">PRESTON INSTITUTE</text>
    <text text-anchor="middle" y="0" font-family="'Cinzel', serif" font-size="20" fill="#1A2847">SCIENCE &amp; TECHNOLOGY</text>
    <path d="M-80,40 L80,40 M-60,70 L60,70 M-30,100 L30,100" stroke="#1A2847" stroke-width="3" />
  </g>

  <!-- Registration Details (Upper Margins) -->
  <text x="75" y="80" class="reg-text">Reg. No: 1531209016</text>
  <text x="75" y="100" class="reg-text">Deg. No: 20111215207</text>

  <!-- Verification Watermark Badge (Subtle official tag) -->
  <text x="1125" y="80" text-anchor="end" class="reg-text" fill="#0F766E">OFFICIAL DEGREE CONFERRAL</text>
  <text x="1125" y="100" text-anchor="end" class="reg-text" fill="#64748B">PRESTON UNIVERSITY CHARTER</text>

  <!-- ================= HEADER SECTION ================= -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <!-- Institute Main Name -->
    <text y="0" class="inst-title" font-size="44">Preston Institute of Management,</text>
    <text y="48" class="inst-title" font-size="40">Science and Technology</text>
    <!-- Location -->
    <text y="86" class="inst-location">Karachi - Pakistan</text>
    <!-- Decorative Separator Line with Center Diamond -->
    <path d="M-220,106 L-20,106 M20,106 L220,106" stroke="#D4AF37" stroke-width="1.5" />
    <polygon points="0,101 6,106 0,111 -6,106" fill="#1A2847" />
  </g>

  <!-- ================= RECIPIENT SECTION ================= -->
  <g transform="translate(600, 315)" text-anchor="middle">
    <!-- Intro -->
    <text y="0" class="cert-intro">This is to Certify That</text>

    <!-- Student Name with Classic Accents -->
    <text y="54" class="student-name">Muhammad Salman</text>
    <path d="M-190,68 L-140,68 M140,68 L190,68" stroke="#D4AF37" stroke-width="1" />

    <!-- Requirements Text -->
    <text y="108" class="body-text">
      has satisfactorily and completely fulfilled all requirements for the prescribed studies and the
    </text>
    <text y="132" class="body-text">
      examinations of the Institute, and has, therefore, been admitted to the Degree of
    </text>
  </g>

  <!-- ================= CONFERRED DEGREE ================= -->
  <g transform="translate(600, 495)" text-anchor="middle">
    <text y="0" class="degree-title">Master of Business Administration</text>
    <text y="38" class="degree-major">in Finance</text>
  </g>

  <!-- ================= TESTIMONY ================= -->
  <g transform="translate(600, 580)" text-anchor="middle">
    <text y="0" class="testimony-text">
      In testimony whereof, this Degree has been issued under authorized signatures
    </text>
    <text y="24" class="testimony-text">
      and official seal of the Institute, on this twentieth day of November 2012.
    </text>
  </g>

  <!-- ================= OFFICIAL GOLD FOIL EMBOSSED SEAL ================= -->
  <g transform="translate(600, 650)" filter="url(#sealShadow)">
    <!-- Starburst Ribbon Points (32 points) -->
    <path d="M 66 0 L 73.71840765878918 6.449524963326704 L 64.99731169880573 11.460779726017401 L 71.47851114539105 19.152609337586533 L 62.01971297186996 22.573329459494136 L 67.0667762407121 31.27375136881176 L 57.15767664977295 32.99999999999999 L 60.61725127738539 42.44465628997741 L 50.55893324585255 42.42398223931159 L 52.32590180780452 52.32590180780451 L 42.4239822393116 50.55893324585255 L 42.44465628997741 60.61725127738539 L 33.00000000000001 57.157676649772945 L 31.27375136881177 67.06677624071209 L 22.573329459494143 62.01971297186995 L 19.15260933758655 71.47851114539105 L 11.460779726017407 64.99731169880573 L 6.449524963326718 73.71840765878918 L 4.0413344371862654e-15 66 L -6.449524963326693 73.71840765878918 L -11.4607797260174 64.99731169880573 L -19.152609337586526 71.47851114539105 L -22.573329459494122 62.01971297186996 L -31.27375136881175 67.0667762407121 L -32.999999999999986 57.15767664977295 L -42.44465628997739 60.61725127738541 L -42.4239822393116 50.55893324585255 L -52.32590180780451 52.32590180780452 L -50.55893324585254 42.423982239311606 L -60.61725127738538 42.44465628997743 L -57.15767664977294 33.00000000000002 L -67.06677624071207 31.27375136881179 L -62.01971297186995 22.573329459494147 L -71.47851114539105 19.152609337586554 L -64.99731169880573 11.460779726017398 L -73.71840765878918 6.449524963326707 L -66 8.082668874372531e-15 L -73.71840765878918 -6.449524963326688 L -64.99731169880573 -11.460779726017382 L -71.47851114539107 -19.152609337586505 L -62.01971297186996 -22.573329459494133 L -67.0667762407121 -31.273751368811745 L -57.157676649772945 -33.00000000000001 L -60.61725127738539 -42.44465628997742 L -50.55893324585257 -42.42398223931157 L -52.32590180780454 -52.325901807804485 L -42.423982239311606 -50.55893324585254 L -42.44465628997743 -60.61725127738538 L -33.00000000000003 -57.15767664977294 L -31.273751368811794 -67.06677624071207 L -22.573329459494126 -62.01971297186996 L -19.152609337586526 -71.47851114539105 L -11.460779726017401 -64.99731169880573 L -6.44952496332671 -73.71840765878918 L -1.2124003311558795e-14 -66 L 6.449524963326684 -73.71840765878918 L 11.460779726017378 -64.99731169880573 L 19.1526093375865 -71.47851114539107 L 22.573329459494154 -62.01971297186995 L 31.27375136881177 -67.06677624071209 L 32.99999999999996 -57.157676649772974 L 42.44465628997736 -60.617251277385435 L 42.42398223931159 -50.55893324585256 L 52.325901807804506 -52.32590180780453 L 50.558933245852536 -42.42398223931161 L 60.61725127738538 -42.44465628997744 L 57.15767664977296 -32.99999999999998 L 67.0667762407121 -31.27375136881174 L 62.01971297186996 -22.57332945949413 L 71.47851114539105 -19.15260933758653 L 64.99731169880573 -11.460779726017405 L 73.71840765878918 -6.4495249633267155 Z" fill="url(#goldFoil)" />

    <!-- Outer Seal Rim -->
    <circle r="64" fill="url(#goldFoil)" stroke="#713F12" stroke-width="1.2" />
    <circle r="59" fill="none" stroke="#713F12" stroke-width="1" stroke-dasharray="3, 2" />
    
    <!-- Seal Center Dome -->
    <circle r="54" fill="url(#sealCenter)" />

    <!-- Seal Lettering Circular Path -->
    <path id="sealTextPathTop_1531209016" d="M -42,0 A 42,42 0 0,1 42,0" fill="none" />
    <path id="sealTextPathBtm_1531209016" d="M 42,0 A 42,42 0 0,1 -42,0" fill="none" />
    
    <text font-family="'Cinzel', serif" font-size="7.5" font-weight="700" fill="#422006" letter-spacing="1.2px">
      <textPath href="#sealTextPathTop_1531209016" startOffset="50%" text-anchor="middle">
        PRESTON INSTITUTE
      </textPath>
    </text>
    <text font-family="'Cinzel', serif" font-size="6.5" font-weight="700" fill="#422006" letter-spacing="1px">
      <textPath href="#sealTextPathBtm_1531209016" startOffset="50%" text-anchor="middle">
        OFFICIAL SEAL ★ KARACHI
      </textPath>
    </text>

    <!-- Center Seal Emblem / Crest -->
    <g transform="translate(0, 3)">
      <circle r="22" fill="none" stroke="#713F12" stroke-width="1.2" />
      <polygon points="0,-16 12,-4 0,8 -12,-4" fill="#713F12" opacity="0.85" />
      <polygon points="0,-11 8,-4 0,3 -8,-4" fill="#FEF08A" />
      <path d="M-8,14 L8,14 M-6,17 L6,17" stroke="#713F12" stroke-width="1.5" />
    </g>
  </g>

  <!-- ================= SIGNATURES SECTION ================= -->
  <!-- Left: Rector -->
  <g transform="translate(230, 715)">
    <!-- Realistic Ink Fountain-Pen Signature -->
    <path d="M-60,-22 C-40,-42 -20,-10 0,-32 C15,-48 30,-22 55,-35 M-30,-26 L35,-26" 
          fill="none" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="-30" class="sig-cursive" text-anchor="middle">E. A. Qureshi</text>
    <!-- Line & Title -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#1E293B" stroke-width="1.5" />
    <text x="0" y="24" class="sig-title" text-anchor="middle">Rector</text>
  </g>

  <!-- Right: Registrar -->
  <g transform="translate(970, 715)">
    <!-- Realistic Ink Fountain-Pen Signature -->
    <path d="M-55,-25 C-35,-45 -10,-12 15,-38 C32,-50 45,-20 65,-28 M-20,-15 L45,-30" 
          fill="none" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="-28" class="sig-cursive" text-anchor="middle">M. A. Farooq</text>
    <!-- Line & Title -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#1E293B" stroke-width="1.5" />
    <text x="0" y="24" class="sig-title" text-anchor="middle">Registrar</text>
  </g>

</svg>