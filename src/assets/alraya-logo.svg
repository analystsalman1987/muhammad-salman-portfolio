<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Cyan to Deep Blue Gradients for Water Droplet Vortex -->
    <linearGradient id="alRayaWater1" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="alRayaWater2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="50%" stop-color="#0096C7" />
      <stop offset="100%" stop-color="#48CAE4" />
    </linearGradient>
    <linearGradient id="alRayaDroplet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="85%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="alRayaSwirlAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Water Droplet & Vortex Swirl Group -->
  <g transform="translate(250, 160)" filter="url(#subtleGlow)">
    <!-- Outer Swirl Arc 1 -->
    <path d="M 0,-115 C 65,-115 115,-65 115,0 C 115,65 65,115 0,115 C -45,115 -85,88 -103,50 C -108,39 -98,30 -87,35 C -72,42 -52,48 -30,48 C 25,48 70,8 70,-45 C 70,-78 48,-102 15,-110 C 6,-113 4,-115 0,-115 Z" fill="url(#alRayaWater1)" opacity="0.9" />

    <!-- Outer Swirl Arc 2 (Tapering Wave Ring) -->
    <path d="M -20,-112 C 45,-108 98,-65 102,0 C 105,52 68,98 18,106 C -35,114 -88,82 -105,32 C -112,12 -112,-20 -98,-45 C -92,-55 -78,-50 -78,-38 C -78,12 -40,65 15,62 C 55,60 78,25 74,-18 C 70,-55 35,-88 -12,-96 C -24,-98 -28,-110 -20,-112 Z" fill="url(#alRayaWater2)" opacity="0.85" />

    <!-- Fine Water Wave Ribbons -->
    <path d="M -85,-15 C -75,-60 -35,-95 18,-92 C 52,-90 82,-65 84,-30 C 86,2 62,38 28,45 C 0,51 -28,38 -45,18 C -52,10 -62,15 -60,24 C -45,55 -5,72 32,64 C 75,54 105,12 100,-35 C 95,-78 55,-110 5,-110 C -45,-110 -88,-70 -95,-20 C -98,-6 -86,-2 -85,-15 Z" fill="url(#alRayaSwirlAccent)" opacity="0.75" />

    <!-- Center Water Teardrop -->
    <path d="M 0,-62 C 2,-42 28,0 28,22 C 28,38 15,52 0,52 C -15,52 -28,38 -28,22 C -28,0 -2,-42 0,-62 Z" fill="url(#alRayaDroplet)" />

    <!-- Teardrop Inner Crest / Wave -->
    <path d="M 0,-45 C 10,-22 18,5 12,25 C 8,36 -2,42 -12,38 C -18,36 -20,28 -14,24 C -5,18 4,8 2,-8 C 0,-22 -5,-35 0,-45 Z" fill="#FFFFFF" opacity="0.95" />

    <!-- Small Splash / Droplet Accents -->
    <circle cx="8" cy="12" r="5" fill="#E0F2FE" />
    <path d="M -15,10 C -12,2 -4,-4 5,-2 C 2,4 -4,8 -10,8 Z" fill="#BAE6FD" />
  </g>

  <!-- Typography: Line 1 - AL RAYA SPECIALTIES -->
  <text 
    x="250" 
    y="360" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Arial Black', sans-serif" 
    font-weight="900" 
    font-size="34" 
    letter-spacing="1" 
    fill="#0C4A9E"
  >
    AL RAYA SPECIALTIES
  </text>

  <!-- Typography: Line 2 - Industrial Factory -->
  <text 
    x="250" 
    y="406" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Arial', sans-serif" 
    font-weight="600" 
    font-size="25" 
    letter-spacing="0.5" 
    fill="#64748B"
  >
    Industrial Factory
  </text>
</svg>
